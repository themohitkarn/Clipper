      const [showSettings, setShowSettings] = useState(false);

      const [aspectRatio, setAspectRatio] = useState('9:16');

      const [maxDuration, setMaxDuration] = useState(60);
      const [maxClips, setMaxClips] = useState(5);
      const [geminiApiKey, setGeminiApiKey] = useState('');

        { label: "Lex Fridman Interview (3 hrs)", url: "https://www.youtube.com/watch?v=jvqFAi7vkBc" },
        { label: "All-In Podcast (1.5 hrs)", url: "https://www.youtube.com/watch?v=W01L70IGBgE" }
      ];

      // Fetch system info
      useEffect(() => {
        fetch('/api/system')
          .then(res => res.json())
          .then(data => setSystemInfo(data))
          .catch(() => setSystemInfo({ ready: false }));
      }, []);

      // Real-time status polling / SSE
      useEffect(() => {
        if (!activeJobId || !isProcessing) return;

        let interval = setInterval(async () => {
          try {
            const res = await fetch(`/api/jobs/${activeJobId}`);
            const data = await res.json();
            setJobData(data);
            if (data.status === 'completed' || data.status === 'failed') {
              setIsProcessing(false);
              clearInterval(interval);
            }
          } catch (e) {
            console.error("Polling error", e);
          }
        }, 1500);

        return () => clearInterval(interval);
      }, [activeJobId, isProcessing]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsProcessing(true);
        setJobData({ status: 'queued', progress: 5, current_step: 'Starting clipping pipeline...' });

        if (activeTab === 'youtube') {
          if (!url.trim()) return;
          try {
            const res = await fetch('/api/process', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                url: url.trim(),
                aspect_ratio: aspectRatio,
                subtitle_style: subtitleStyle,
                min_duration: parseInt(minDuration),
                max_duration: parseInt(maxDuration),
                max_clips: parseInt(maxClips),
                gemini_api_key: geminiApiKey.trim() || null
              })
            });
            const data = await res.json();
            if (data.job_id) {
              setActiveJobId(data.job_id);
            } else {
              alert(data.detail || "Error starting process");
              setIsProcessing(false);
            }
          } catch (err) {
            alert("Connection error to Clipper backend.");
            setIsProcessing(false);
          }
        } else {
          if (!file) return;
          const formData = new FormData();
          formData.append('file', file);
          formData.append('aspect_ratio', aspectRatio);
          formData.append('subtitle_style', subtitleStyle);
          formData.append('min_duration', minDuration);
          formData.append('max_duration', maxDuration);
          formData.append('max_clips', maxClips);
          if (geminiApiKey.trim()) formData.append('gemini_api_key', geminiApiKey.trim());

          try {
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.job_id) {
              setActiveJobId(data.job_id);
            } else {
              alert(data.detail || "Upload error");
              setIsProcessing(false);
            }
          } catch (err) {
            alert("Upload failed.");
            setIsProcessing(false);
          }
        }
      };

                  React.createElement('div', { className: 'flex items-center gap-2 text-slate-400 whitespace-nowrap' },

          React.createElement('p', { className: 'max-w-md mx-auto mb-2' },
            'Clipper AI — Open Source 100% Free Video Highlights & Automated Clipping Platform'
          ),
          React.createElement('p', null,
            'Created for ',
            React.createElement('a', {
              href: 'https://github.com/themohitkarn/Clipper',
              target: '_blank',
              rel: 'noopener noreferrer',

    ReactDOM.createRoot(document.getElementById('root')).render(
