    const Key = createSvgIcon([e('circle', { cx: '7.5', cy: '15.5', r: '5.5' }), e('path', { d: 'm21 2-9.6 9.6' }), e('path', { d: 'm15.5 7.5 3 3L22 7l-3-3' })]);
    const Flame = createSvgIcon([e('path', { d: 'M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z' })]);
    const Download = createSvgIcon([

    const Subtitles = createSvgIcon([e('rect', { width: '20', height: '16', x: '2', y: '4', rx: '2' }), e('path', { d: 'M7 15h4M15 15h2M7 11h2M13 11h4' })]);
    const Share2 = createSvgIcon([
      e('circle', { cx: '18', cy: '5', r: '3' }),
      e('circle', { cx: '6', cy: '12', r: '3' }),
      e('circle', { cx: '18', cy: '19', r: '3' }),

    const Check = createSvgIcon([e('polyline', { points: '20 6 9 17 4 12' })]);
    const Loader2 = ({ className = "w-4 h-4", ...props }) =>
      e('svg', {
        xmlns: "http://www.w3.org/2000/svg",
        viewBox: "0 0 24 24",
        fill: "none",

      }, e('path', { d: 'M21 12a9 9 0 1 1-6.219-8.56' }));
    const Scissors = createSvgIcon([
      e('circle', { cx: '6', cy: '6', r: '3' }),
      e('circle', { cx: '6', cy: '18', r: '3' }),
      e('line', { x1: '20', x2: '8.12', y1: '4', y2: '15.88' }),

    const MessageSquareQuote = createSvgIcon([e('path', { d: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z' })]);
    const DownloadCloud = createSvgIcon([
      e('path', { d: 'M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242' }),
      e('path', { d: 'm8 17 4 4 4-4' }),
      e('path', { d: 'M12 12v9' })
    ]);
    const X = createSvgIcon([e('path', { d: 'M18 6 6 18' }), e('path', { d: 'm6 6 12 12' })]);

    function App() {
      const [systemInfo, setSystemInfo] = useState(null);
      const [activeTab, setActiveTab] = useState('youtube');
      const [url, setUrl] = useState('');
      const [file, setFile] = useState(null);
      const [showSettings, setShowSettings] = useState(false);

      // Settings
      const [aspectRatio, setAspectRatio] = useState('9:16');
      const [subtitleStyle, setSubtitleStyle] = useState('hormozi');
      const [minDuration, setMinDuration] = useState(20);
      const [maxDuration, setMaxDuration] = useState(60);
      const [maxClips, setMaxClips] = useState(10);
      const [geminiApiKey, setGeminiApiKey] = useState('');

      // Job State
      const [activeJobId, setActiveJobId] = useState(null);
      const [jobData, setJobData] = useState(null);
      const [isProcessing, setIsProcessing] = useState(false);
      const [editingClip, setEditingClip] = useState(null);
      const [filterScore, setFilterScore] = useState(0);
      const [sortBy, setSortBy] = useState('score');

      const sampleVideos = [
        { label: "Alex Hormozi Podcast (1 hr)", url: "https://www.youtube.com/watch?v=7h2YqIu_XjQ" },
        { label: "Lex Fridman Interview (3 hrs)", url: "https://www.youtube.com/watch?v=jvqFAi7vkBc" },
        { label: "All-In Podcast (1.5 hrs)", url: "https://www.youtube.com/watch?v=W01L70IGBgE" }
      ];

      // Fetch system info
      useEffect(() => {
        fetch('/api/system')
          .then(res => res.json())
          .then(data => setSystemInfo(data))
          .catch(() => setSystemInfo({ ready: false }));
      }, []);

      // Real-time status polling / SSE
      useEffect(() => {
        if (!activeJobId || !isProcessing) return;

        let interval = setInterval(async () => {
          try {
            const res = await fetch(`/api/jobs/${activeJobId}`);
            const data = await res.json();
            setJobData(data);
            if (data.status === 'completed' || data.status === 'failed') {
              setIsProcessing(false);
              clearInterval(interval);
            }
          } catch (err) {
            console.error("Polling error", err);
          }
        }, 1500);

        return () => clearInterval(interval);
      }, [activeJobId, isProcessing]);

      const handleSubmit = async (ev) => {
        ev.preventDefault();
        setIsProcessing(true);
        setJobData({ status: 'queued', progress: 5, current_step: 'Starting clipping pipeline...' });

        if (activeTab === 'youtube') {
          if (!url.trim()) return;
          try {
            const res = await fetch('/api/process', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                url: url.trim(),
                aspect_ratio: aspectRatio,
                subtitle_style: subtitleStyle,
                min_duration: parseInt(minDuration),
                max_duration: parseInt(maxDuration),
                max_clips: parseInt(maxClips),
                gemini_api_key: geminiApiKey.trim() || null
              })
            });
            const data = await res.json();
            if (data.job_id) {
              setActiveJobId(data.job_id);
            } else {
              alert(data.detail || "Error starting process");
              setIsProcessing(false);
            }
          } catch (err) {
            alert("Failed to connect to backend server.");
            setIsProcessing(false);
          }
        } else {
          // File Upload
          if (!file) {
            alert("Please select a video file first.");
            setIsProcessing(false);
            return;
          }
          const formData = new FormData();
          formData.append('file', file);
          formData.append('aspect_ratio', aspectRatio);
          formData.append('subtitle_style', subtitleStyle);
          formData.append('min_duration', minDuration);
          formData.append('max_duration', maxDuration);
          formData.append('max_clips', maxClips);
          if (geminiApiKey) formData.append('gemini_api_key', geminiApiKey);

          try {
            const res = await fetch('/api/upload', {
              method: 'POST',
              body: formData
            });
            const data = await res.json();
            if (data.job_id) {
              setActiveJobId(data.job_id);
            } else {
              alert(data.detail || "Upload error");
              setIsProcessing(false);
            }
          } catch (err) {
            alert("Upload failed.");
            setIsProcessing(false);
          }
        }
      };

      const filteredClips = (jobData?.clips || [])
        .filter(c => c.viral_score >= filterScore)
        .sort((a, b) => sortBy === 'score' ? b.viral_score - a.viral_score : a.start_time - b.start_time);

      return e('div', { className: 'min-h-screen flex flex-col' },
        // Navbar
        e('header', { className: 'border-b border-slate-800 bg-[#0f1422] sticky top-0 z-50' },
          e('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between' },

            ),
            e('div', { className: 'flex items-center gap-3' },
              e('a', {

                rel: 'noopener noreferrer',

              e('span', null, 'Free Alternative to Opus Clip, Munch & Klap')

                  activeTab === 'youtube'
                    ? 'bg-blue-600 text-white'
                    : 'text-slate-400 hover:text-white'
                }`
              },
                e(Youtube, { className: 'w-4 h-4 text-red-500' }),
                e('span', null, 'YouTube URL')
              ),
              e('button', {
                type: 'button',
                onClick: () => setActiveTab('upload'),
                className: `flex-1 py-2.5 px-4 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                  activeTab === 'upload'
                    ? 'bg-blue-600 text-white'
                    : 'text-slate-400 hover:text-white'
                }`

                e('span', null, 'Upload Local Video')
              )
            ),

            // Form
            e('form', { onSubmit: handleSubmit, className: 'space-y-6' },

                        e(Youtube, { className: 'w-5 h-5 text-red-500' })
                      ),
                      e('input', {
                        type: 'url',

                        onChange: (ev) => setUrl(ev.target.value),

              // Settings Toggle Button

                e('button', {

                  ),

                      e('option', { value: '9:16' }, '9:16 (TikTok, Shorts, Reels - Blurred BG)'),
                      e('option', { value: '1:1' }, '1:1 (Instagram Feed / Square)'),
                      e('option', { value: '16:9' }, '16:9 (Landscape / Original)')
                    )
                  ),

                  // Subtitle Style
                  e('div', { className: 'space-y-1.5' },
                    e('label', { className: 'text-xs font-semibold text-slate-300 flex items-center gap-1.5' },
                      e(Type, { className: 'w-3.5 h-3.5 text-blue-400' }),
                      e('span', null, 'Subtitle Style')
                    ),
                    e('select', {
                      value: subtitleStyle,

                  // Clip Duration
                  e('div', { className: 'space-y-1.5' },
                    e('label', { className: 'text-xs font-semibold text-slate-300 flex items-center gap-1.5' },
                      e(Clock, { className: 'w-3.5 h-3.5 text-blue-400' }),
                      e('span', null, `Clip Duration: ${minDuration}s - ${maxDuration}s`)
                    ),
                    e('div', { className: 'flex items-center gap-2' },
                      e('input', {
                        type: 'range',
                        min: '15',
                        max: '90',
                        value: maxDuration,
                        onChange: (ev) => setMaxDuration(ev.target.value),
                        className: 'w-full accent-blue-600'
                      })
                    )
                  ),

                  // Number of clips
                  e('div', { className: 'space-y-1.5' },
                    e('label', { className: 'text-xs font-semibold text-slate-300 flex items-center justify-between' },
                      e('span', { className: 'flex items-center gap-1.5' },
                        e(Flame, { className: 'w-3.5 h-3.5 text-amber-400' }),
                        e('span', null, 'Target Clips')
                      ),
                      e('span', { className: 'text-[11px] text-blue-400 font-bold' }, `${maxClips} Clips`)
                    ),
                    e('div', { className: 'flex items-center gap-2' },
                      e('select', {
                        value: [3, 5, 10, 15, 20, 25, 30, 35, 36, 40, 50].includes(Number(maxClips)) ? String(maxClips) : 'custom',
                        onChange: (ev) => {
                          if (ev.target.value !== 'custom') setMaxClips(Number(ev.target.value));
                        },
                        className: 'flex-1 p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white text-xs focus:ring-1 focus:ring-blue-500'
                      },
                        e('option', { value: '3' }, '3 Best Clips'),
                        e('option', { value: '5' }, '5 Best Clips'),
                        e('option', { value: '10' }, '10 Best Clips (Standard)'),
                        e('option', { value: '15' }, '15 Clips (Long Video)'),
                        e('option', { value: '20' }, '20 Clips (1-2 Hr Video)'),
                        e('option', { value: '25' }, '25 Clips (2+ Hr Video)'),
                        e('option', { value: '30' }, '30 Clips (Long Stream)'),
                        e('option', { value: '35' }, '35 Clips (Full Coverage) 🔥'),
                        e('option', { value: '36' }, '36 Clips (Max Highlights) 🔥'),
                        e('option', { value: '40' }, '40 Clips (Marathon Video)'),
                        e('option', { value: '50' }, '50 Clips (24-Hour Stream)'),
                        e('option', { value: 'custom' }, 'Custom Quantity...')
                      ),
                      e('input', {
                        type: 'number',
                        min: '1',
                        max: '100',
                        value: maxClips,
                        onChange: (ev) => setMaxClips(Math.max(1, Math.min(100, parseInt(ev.target.value) || 1))),
                        placeholder: 'Qty',
                        title: 'Type exact number of clips (e.g. 10, 35, 36)',
                        className: 'w-20 p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white text-xs font-bold text-center focus:ring-1 focus:ring-blue-500'
                      })
                    )
                  ),

                  // Optional Gemini API Key
                  e('div', { className: 'sm:col-span-2 space-y-1.5' },
                    e('label', { className: 'text-xs font-semibold text-slate-300 flex items-center justify-between' },
                      e('span', { className: 'flex items-center gap-1.5' },
                        e(Key, { className: 'w-3.5 h-3.5 text-blue-400' }),
                        e('span', null, 'Google Gemini API Key (Optional)')
                      ),
                      e('span', { className: 'text-[10px] text-blue-400 font-bold' }, 'Smart Heuristic is 100% Free')
                    ),
                    e('input', {
                      type: 'password',
                      value: geminiApiKey,
                      onChange: (ev) => setGeminiApiKey(ev.target.value),
                      placeholder: 'AIzaSy... (Leave empty to use built-in free Heuristic engine)',
                      className: 'w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-xs focus:ring-1 focus:ring-blue-500'
                    })
                  )
                )
              ),

              // Submit Button
              e('button', {
                type: 'submit',
                disabled: isProcessing,
                className: `w-full py-3.5 rounded-xl font-bold text-sm tracking-wide text-white uppercase flex items-center justify-center gap-2 transition-all ${
                  isProcessing ? 'bg-slate-800 cursor-not-allowed text-slate-400' : 'bg-blue-600 hover:bg-blue-500 shadow-md'
                }`
              },
                isProcessing
                  ? [e(Loader2, { key: 'l', className: 'w-5 h-5' }), e('span', { key: 't' }, 'Processing Video Moments...')]
                  : [e(Sparkles, { key: 's', className: 'w-5 h-5' }), e('span', { key: 't' }, 'Generate Viral Clips (100% Free)')]
              )
            )
          ),

          // Real-time Pipeline Progress Status Box
          isProcessing && jobData && e('div', { className: 'max-w-4xl mx-auto bg-[#0f1422] border border-slate-800 rounded-2xl p-6 shadow-xl mb-10' },
            e('div', { className: 'flex items-center justify-between mb-4' },
              e('div', { className: 'flex items-center gap-3' },
                e('div', { className: 'w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400' },
                  e(Scissors, { className: 'w-5 h-5 animate-pulse' })
                ),
                e('div', null,
                  e('h3', { className: 'font-bold text-white text-base' }, 'Generating Your Highlights...'),
                  e('p', { className: 'text-xs text-slate-400' }, jobData.current_step || 'Analyzing video audio...')
                )
              ),
              e('span', { className: 'font-black text-2xl text-blue-500' }, `${jobData.progress || 10}%`)
            ),
            // Progress Bar
            e('div', { className: 'w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-800 p-0.5' },
              e('div', {
                className: 'bg-blue-600 h-full rounded-full transition-all duration-300',
                style: { width: `${jobData.progress || 10}%` }
              })
            ),
            e('div', { className: 'flex items-center justify-between mt-3 text-[11px] text-slate-400' },
              e('span', null, 'Selective streaming (No gigabyte downloads)'),
              e('span', null, jobData.status)
            )
          ),

          // Results: Clips Showcase
          jobData && jobData.clips && jobData.clips.length > 0 && e('div', { className: 'max-w-6xl mx-auto space-y-6' },
            // Results Header
            e('div', { className: 'flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-[#0f1422] border border-slate-800 p-6 rounded-2xl' },
              e('div', null,
                e('div', { className: 'flex items-center gap-2 mb-1' },
                  e(CheckCircle2, { className: 'w-5 h-5 text-emerald-400' }),
                  e('h3', { className: 'font-bold text-xl text-white' }, `Found ${jobData.clips.length} Viral Highlights!`)
                ),
                e('p', { className: 'text-xs text-slate-400' },
                  jobData.source_title ? `From: ${jobData.source_title}` : 'Clips extracted with high retention hooks.'
                )
              ),
              e('div', { className: 'flex items-center gap-3 w-full sm:w-auto' },
                e('a', {
                  href: `/api/jobs/${activeJobId}/download-zip`,
                  className: 'w-full sm:w-auto px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs flex items-center justify-center gap-2 transition-all shadow-md'
                },
                  e(DownloadCloud, { className: 'w-4 h-4' }),
                  e('span', null, 'Download All (.ZIP)')
                )
              )
            ),

            // Clips Grid
            e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6' },
              filteredClips.map((clip, idx) =>
                e('div', { key: clip.id || idx, className: 'bg-[#0f1422] border border-slate-800 hover:border-slate-700 rounded-2xl overflow-hidden flex flex-col transition-all shadow-lg group' },
                  // Video Preview Player
                  e('div', { className: 'relative bg-black aspect-[9/16] max-h-[380px] overflow-hidden' },
                    e('video', {
                      src: clip.video_url,
                      poster: clip.thumbnail_url,
                      controls: true,
                      preload: 'metadata',
                      className: 'w-full h-full object-cover'
                    }),
                    // Virality Badge
                    e('div', { className: 'absolute top-3 left-3 px-3 py-1.5 rounded-full bg-slate-900/90 border border-slate-700 flex items-center gap-1.5 shadow-md pointer-events-none' },
                      e(Flame, { className: 'w-3.5 h-3.5 text-amber-400 fill-amber-400' }),
                      e('span', { className: 'text-xs font-bold text-white' }, `${clip.viral_score}/100`),
                      e('span', { className: 'text-[10px] text-slate-400 font-semibold' }, 'SCORE')
                    ),
                    // Duration Badge
                    e('div', { className: 'absolute top-3 right-3 px-2.5 py-1 rounded-lg bg-black/80 text-[11px] font-bold text-slate-300 pointer-events-none' },
                      `${clip.duration}s`
                    )
                  ),

                  // Clip Metadata & Action Bar
                  e('div', { className: 'p-5 flex-1 flex flex-col justify-between' },
                    e('div', null,
                      e('h4', { className: 'font-bold text-white text-base leading-snug mb-2 line-clamp-2' }, clip.title),
                      e('p', { className: 'text-xs text-slate-300 mb-3 line-clamp-2 bg-slate-900 p-2.5 rounded-xl border border-slate-800 italic' }, `"${clip.hook_text}"`),
                      e('p', { className: 'text-[11px] text-slate-400 mb-4' },
                        e('strong', { className: 'text-blue-400' }, 'Why it works: '),
                        clip.viral_reason
                      )
                    ),
                    e('div', { className: 'pt-3 border-t border-slate-800 flex flex-col gap-2' },
                      e('a', {
                        href: clip.video_url,
                        download: `${clip.title}.mp4`,
                        className: 'w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 transition-all'
                      },
                        e(Download, { className: 'w-4 h-4' }),
                        e('span', null, 'Download Clip (MP4)')
                      ),
                      e('div', { className: 'grid grid-cols-2 gap-2 text-xs' },
                        e('a', {
                          href: clip.srt_url,
                          download: `${clip.id}.srt`,
                          className: 'py-1.5 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold flex items-center justify-center gap-1 border border-slate-700'
                        },
                          e(Subtitles, { className: 'w-3.5 h-3.5 text-yellow-400' }),
                          e('span', null, '.SRT Subtitles')
                        ),
                        e('button', {
                          type: 'button',
                          onClick: () => {
                            navigator.clipboard.writeText(`${clip.title}\n\n${clip.hook_text}\n\n#shorts #viral #reels #tiktok #clips`);
                            alert("Copied title and hashtags to clipboard!");
                          },
                          className: 'py-1.5 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold flex items-center justify-center gap-1 border border-slate-700'
                        },
                          e(Share2, { className: 'w-3.5 h-3.5 text-blue-400' }),
                          e('span', null, 'Copy Caption')
                        )
                      )
                    )
                  )
                )
              )
            )
          ),

          // Features Highlights
          e('div', { className: 'mt-20 border-t border-slate-800 pt-16' },
            e('div', { className: 'text-center mb-10' },
              e('h3', { className: 'text-2xl sm:text-3xl font-bold text-white' },
                'Everything Top Clipping Software Does — ',
                e('span', { className: 'text-blue-500' }, 'Free Forever')
              ),
              e('p', { className: 'text-xs sm:text-sm text-slate-400 mt-2 max-w-xl mx-auto' },
                'Built for creators, podcasters, streamers, and agencies who need limitless clipping.'
              )
            ),
            e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6' },
              [
                { title: '10 Min to 24+ Hr Videos', desc: 'Selective time-slice streaming downloads only the 60s clips without downloading 40GB video files.' },
                { title: 'AI Hook & Virality Score', desc: 'Ranks top moments by scroll-stopping hooks, curiosity gaps, and audience retention metrics.' },
                { title: '9:16 Vertical Reframe', desc: 'Smart podcast-style blurred background + center crop for high production value on TikTok & Reels.' },
                { title: 'Alex Hormozi Subtitles', desc: 'Bold animated yellow captions with auto-injected emojis (💰, 🔥, 🤯, 🛑) burned into video.' },
                { title: 'One-Click Batch Export', desc: 'Download individual MP4s, .SRT subtitle files, or export all generated clips as a ZIP archive.' },
                { title: '100% Free & No Watermark', desc: 'No paid subscriptions, no monthly limits, no cloud fees. Built with open-source tools.' }
              ].map((f, i) =>
                e('div', { key: i, className: 'bg-[#0f1422] border border-slate-800 rounded-2xl p-6' },
                  e('h4', { className: 'font-bold text-base mb-1.5 text-white' }, f.title),
                  e('p', { className: 'text-xs text-slate-400 leading-relaxed' }, f.desc)
                )
              )
            )
          )
        ),

        // Footer
        e('footer', { className: 'border-t border-slate-800 bg-[#0b0f19] py-8 text-center text-xs text-slate-500' },
          e('p', { className: 'max-w-md mx-auto mb-2' },
            'Clipper AI — Open Source 100% Free Video Highlights & Automated Clipping Platform'
          ),
          e('p', null,
            'Created for ',
            e('a', {
              href: 'https://github.com/themohitkarn/Clipper',
              target: '_blank',
              rel: 'noopener noreferrer',
              className: 'text-blue-500 hover:text-blue-400 font-semibold underline'
            }, 'themohitkarn/Clipper')
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      e(StrictMode, null, e(App))
    );
  </script>
</body>
</html>
